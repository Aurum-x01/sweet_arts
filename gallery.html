<body data-page="gallery">
<canvas id="bg"></canvas>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="cursor" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="logo" href="index.html">SWEET <b>ARTS</b></a>
  <nav class="menu" id="menu">
    <a href="index.html" data-nav="home" data-i18n="nav.home">Home</a>
    <a href="gallery.html" data-nav="gallery" data-i18n="nav.gallery">Gallery</a>
    <a href="prices.html" data-nav="prices" data-i18n="nav.prices">Prices</a>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="uk">UA</button></div>
  </nav>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
</header>

<main class="wrap">
  <div class="page-head">
    <span class="kicker" data-i18n="gal.kicker">Portfolio</span>
    <h1 style="font-size:clamp(2.4rem,6vw,4.4rem)" data-i18n="gal.title">Gallery</h1>
    <p data-i18n="gal.sub">Click any artwork to view it full screen.</p>
  </div>
  <div class="toolbar">
    <span class="muted" id="count"></span>
    <button class="pill" id="sort" type="button"></button>
  </div>
  <div id="status"></div>
  <noscript><p class="muted" style="text-align:center;padding:40px 0">Please enable JavaScript to view the gallery.</p></noscript>
  <div class="grid" id="grid"></div>
</main>

<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true">
  <button class="lb-btn lb-close" data-act="close" data-i18n-title="gal.close">✕</button>
  <button class="lb-btn lb-fs" data-act="fs" data-i18n-title="gal.fs">⛶</button>
  <button class="lb-btn lb-prev" data-act="prev" data-i18n-title="gal.prev">‹</button>
  <button class="lb-btn lb-next" data-act="next" data-i18n-title="gal.next">›</button>
  <figure class="lb-fig">
    <img id="lbImg" alt="" draggable="false">
    <figcaption><span id="lbCap"></span><em id="lbNum"></em></figcaption>
  </figure>
</div>

<footer>
  <div class="wrap">
    <span>© <span data-year></span> Sweet Arts — <span data-i18n="foot.rights">All rights reserved.</span></span>
    <span data-i18n="foot.note">Please do not use or repost my art without permission.</span>
  </div>
</footer>
